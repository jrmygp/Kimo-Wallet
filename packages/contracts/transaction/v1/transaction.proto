syntax = "proto3";

package transaction.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/jrmygp/kimo-wallet/apps/transaction-service/gen/transaction/v1;transactionv1";

message Transaction {
  string id = 1;
  string idempotency_key = 2;
  string sender_user_id = 3;
  string sender_wallet_id = 4;
  string receiver_user_id = 5;
  string receiver_wallet_id = 6;
  int64 amount = 7;
  string currency = 8;
  string status = 9;
  google.protobuf.Timestamp created_at = 10;
}

message CreateTransactionRequest {
  string idempotency_key = 1;
  string sender_user_id = 2;
  string sender_wallet_id = 3;
  string receiver_user_id = 4;
  string receiver_wallet_id = 5;
  int64 amount = 6;
  string currency = 7;
}

message CreateTransactionResponse {
  Transaction transaction = 1;
}

service TransactionService {
  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse);
}
