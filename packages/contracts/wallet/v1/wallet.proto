syntax = "proto3";

package wallet.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/jrmygp/kimo-wallet/apps/wallet-service/gen/wallet/v1;walletv1";

message Wallet {
  string id = 1;
  string user_id = 2;
  int64 balance = 3;
  string currency = 4;
  string status = 5;
  google.protobuf.Timestamp created_at = 6;
}

message GetWalletByUserIDRequest {
  string user_id = 1;
}

message GetWalletByUserIDResponse {
  Wallet wallet = 1;
}

service WalletService {
  rpc GetWalletByUserID(GetWalletByUserIDRequest) returns (GetWalletByUserIDResponse);
}