syntax = "proto3";

package user.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/jrmygp/kimo-wallet/apps/user-service/gen/user/v1;userv1";

// User is the canonical identity record owned by the User Service.
message User {
  string id = 1;
  string phone_number = 2;
  string full_name = 3;
  google.protobuf.Timestamp created_at = 4;
  // May be unset — a user with no profile picture. `optional` (rather than
  // plain string) so "unset" and "set to an empty string" aren't conflated.
  optional string profile_picture = 5;
  // Public-facing identifier: 12 uppercase alphanumeric characters
  // (A-Z0-9), unique, auto-generated at creation. Used to look this user
  // up (see GetUserByIDRequest) instead of the internal `id` above, which
  // is never meant to be typed or shared by a user.
  string kimo_id = 6;
}

message RegisterRequest {
  // E.164 format, e.g. "+6281234567890".
  string phone_number = 1;
  string full_name = 2;
}

message RegisterResponse {
  User user = 1;
  // Short-lived JWT access token for the newly registered user.
  string access_token = 2;
}

message LoginRequest {
  string phone_number = 1;
}

message LoginResponse {
  User user = 1;
  // Short-lived JWT access token for the authenticated user.
  string access_token = 2;
}

message GetUserByIDRequest {
  // The user's KimoID (see User.kimo_id above), not the internal `id`.
  string kimo_id = 1;
}

message GetUserByIDResponse {
  User user = 1;
}

// UserService owns user identity and profile data.
// It is the source of truth for "does this user exist".
service UserService {
  // Register creates a new user identity from a phone number and full name.
  // Fails with ALREADY_EXISTS if the phone number is already registered.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetUserByID(GetUserByIDRequest) returns (GetUserByIDResponse);
}
